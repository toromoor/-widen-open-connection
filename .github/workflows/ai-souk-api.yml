name: AI Souk API tests

on:
  push:
    branches:
      - experiment/ai-souk-first-principles-20261109
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q tests/test_souk_service.py tests/test_security.py
