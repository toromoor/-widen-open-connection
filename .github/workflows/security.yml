name: WIDEN security and regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx pip-audit
      - name: Syntax and security contract tests
        run: |
          python -m compileall -q server.py
          python -m pytest tests -q
      - name: Audit Python dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt
